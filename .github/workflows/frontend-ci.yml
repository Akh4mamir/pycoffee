name: Frontend CI

on:
  push:
    branches: [ "main" ]
    paths:
      - 'frontend/**' 

jobs:
  build:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./frontend

    steps:
    - name: Checkout do código
      uses: actions/checkout@v4

    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Instalar dependências
      run: npm install

    - name: Compilar o projeto (Build)
      run: npm run build